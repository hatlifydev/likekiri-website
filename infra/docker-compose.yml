# SOLO para desarrollo local (Postgres). No es infraestructura de producción.
# Nota: el VPS de producción no tiene Docker (ADR 002); allí Postgres se
# instala nativo vía apt, escuchando únicamente en 127.0.0.1 (ADR 003).
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: likekiri
      POSTGRES_PASSWORD: likekiri
      POSTGRES_DB: likekiri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U likekiri']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
