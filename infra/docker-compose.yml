# SOLO para desarrollo local (Postgres + Redis). No es infraestructura de
# producción. Nota: el VPS de producción no tiene Docker (ADR 002); allí estos
# servicios se instalan nativos, siempre escuchando únicamente en 127.0.0.1.
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: likekiri
      POSTGRES_PASSWORD: likekiri
      POSTGRES_DB: likekiri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U likekiri']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
